<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17428f" />
  <meta name="application-name" content="Rumo ao Esporte" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Rumo Esporte" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Portal do aluno Rumo ao Esporte: pagamentos, carteirinha e informações em um só lugar." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
  <title>Rumo ao Esporte</title>
  <script>
    // O Chrome dispara 'beforeinstallprompt' assim que a página carrega, antes do
    // React montar. Guardamos o evento aqui para o botão "Instalar App" poder
    // abrir a caixa nativa de instalação a qualquer momento depois.
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__raeInstallPrompt = event;
      window.dispatchEvent(new CustomEvent('rae:install-prompt-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__raeInstallPrompt = null;
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
